name: Build and release Linux + Windows
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (for example v0.6.7)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      APPIMAGE_EXTRACT_AND_RUN: '1'
      RLCUT_PREBUILT_AI_APPIMAGE: https://github.com/nachat-ayoub/rlcut/releases/download/v0.6.6/rlcut-Linux-x86_64.AppImage
      RLCUT_PREBUILT_AI_SHA256: 4782e5fe06fd70fa70c5f2d86d55bb4ba00c20c1da8cebef55fa9d504493988d
    steps:
      - name: Install clean Ubuntu 22.04 build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git curl python3 file wget xz-utils unzip build-essential cmake libpng-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf ffmpeg libvulkan1 libgstreamer1.0-dev gstreamer1.0-tools gstreamer1.0-libav gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build Linux AppImage
        run: |
          bash scripts/prepare-appimage.sh
          npm run desktop:build:native -- --bundles appimage --config src-tauri/tauri.appimage.conf.json
          mkdir -p dist
          mapfile -t images < <(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -type f)
          test "${#images[@]}" -eq 1
          cp "${images[0]}" dist/rlcut-Linux-x86_64.AppImage
          rustc --edition=2021 -C opt-level=2 -C strip=symbols scripts/linux-launcher.rs -o dist/rlcut-Linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: rlcut-Linux-x86_64
          path: |
            dist/rlcut-Linux-x86_64.AppImage
            dist/rlcut-Linux-x86_64
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/cache@v4
        with:
          path: .runtime/windows/ffmpeg-8.1.2-essentials_build.zip
          key: windows-ffmpeg-8.1.2-db580001
      - run: npm ci
      - name: Prepare verified Windows video tools
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-tools.log'
          try {
            & ./scripts/prepare-windows-tools.ps1 2>&1 | Tee-Object -FilePath $log
          } catch {
            $_ | Out-String | Tee-Object -FilePath $log -Append | Write-Host
            $detail = ((Get-Content $log -Tail 40) -join ' | ').Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Host "::error title=Windows video tools failed::$detail"
            exit 1
          }
      - name: Build Windows installer
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-installer.log'
          & npm run desktop:build:native -- --config src-tauri/tauri.windows.conf.json 2>&1 | Tee-Object -FilePath $log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $detail = ((Get-Content $log -Tail 60) -join ' | ').Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Host "::error title=Windows installer build failed::$detail"
            exit $buildExit
          }
          $installer = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe')
          if ($installer.Count -ne 1) {
            Write-Host "::error title=Windows installer missing::Expected one NSIS installer, found $($installer.Count)."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $installer[0].FullName 'dist/rlcut-Windows-x86_64-setup.exe' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: rlcut-Windows-x86_64
          path: dist/rlcut-Windows-x86_64-setup.exe
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rlcut-*
          path: dist
          merge-multiple: true
      - name: Verify and checksum release assets
        working-directory: dist
        run: |
          test -s rlcut-Linux-x86_64.AppImage
          test -s rlcut-Linux-x86_64
          test -s rlcut-Windows-x86_64-setup.exe
          sha256sum rlcut-* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish all native downloads
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          Native rlcut downloads for Linux and Windows.

          - Linux: `rlcut-Linux-x86_64.AppImage` or the FUSE-independent `rlcut-Linux-x86_64` launcher.
          - Windows 10/11 x64: `rlcut-Windows-x86_64-setup.exe` with FFmpeg bundled. Windows 11 already includes WebView2; the installer fetches it on older systems when needed.
          Offline AI smoothing/upscaling is currently included only in the Linux package; normal editing and export are available on both platforms.

          Verify downloads with `SHA256SUMS`.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "rlcut $RELEASE_TAG" --notes-file /tmp/release-notes.md
          fi
