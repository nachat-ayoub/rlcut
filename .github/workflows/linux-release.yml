name: Linux AppImage release
on:
  # Tag creation is separate from push CI, so a build-only release is possible
  # even when a commit deliberately skips the repository's test workflow.
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (for example v0.2.0)'
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: linux-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  appimage:
    if: github.event_name == 'workflow_dispatch' || (github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')) || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release-build-'))
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - name: Clean Ubuntu 22.04 build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # A clean container avoids preinstalled runner packages conflicting with GTK.
          if ! apt-get update > /tmp/rlcut-apt.log 2>&1 || ! apt-get install -y --no-install-recommends ca-certificates git gh curl python3 file wget xz-utils unzip build-essential cmake libpng-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf ffmpeg libvulkan1 libgstreamer1.0-dev gstreamer1.0-tools gstreamer1.0-libav gstreamer1.0-plugins-base gstreamer1.0-plugins-good >> /tmp/rlcut-apt.log 2>&1; then
            message="$(tail -c 2500 /tmp/rlcut-apt.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            printf '::error::%s\n' "$message"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build Linux AppImage (no test execution)
        run: |
          exec > >(tee /tmp/rlcut-build.log) 2>&1
          report_failure() {
            status=$?
            trap - ERR
            message="$(tail -c 2500 /tmp/rlcut-build.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            printf '::error::%s\n' "$message"
            exit "$status"
          }
          trap report_failure ERR
          bash scripts/prepare-appimage.sh
          npm run desktop:build:native -- --bundles appimage --config src-tauri/tauri.appimage.conf.json
          mkdir -p dist
          mapfile -t images < <(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -type f)
          test "${#images[@]}" -eq 1
          cp "${images[0]}" dist/rlcut-Linux-x86_64.AppImage
          cp dist/rlcut-Linux-x86_64.AppImage dist/rlcut.AppImage
          rustc --edition=2021 -C opt-level=2 -C strip=symbols scripts/linux-launcher.rs -o dist/rlcut-Linux-x86_64
          cd dist
          sha256sum rlcut-Linux-x86_64.AppImage rlcut-Linux-x86_64 > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rlcut-Linux-x86_64
          path: |
            dist/rlcut-Linux-x86_64.AppImage
            dist/rlcut-Linux-x86_64
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
  publish:
    # Publish on the host with current gh, outside the build container. A publishing
    # failure must not discard successful builds or prevent Rust cache saving.
    needs: appimage
    if: github.event_name == 'workflow_dispatch' || github.event.ref_type == 'tag'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rlcut-Linux-x86_64
          path: dist
      - name: Verify downloadable artifacts
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish downloadable GitHub release assets
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          Linux x86_64 AppImage with optional offline RIFE AI smoothing in Export.

          Download `rlcut-Linux-x86_64.AppImage`, make it executable, and run it. If FUSE is unavailable, run with `--appimage-extract-and-run`, or use the single-file `rlcut-Linux-x86_64` launcher instead.

          Font export fix: titles are rendered once using the editor's browser font engine, preserving Google variable-font weight/italic selection instead of FFmpeg opening the font at its default weight. Transparent text images are composited after the AI pass. Google Fonts search now includes a bundled catalog of 1,959 families, including Bricolage Grotesque, and reselecting downloaded fonts retains their style variants.

          Completed full-AI caches from stock v0.5.0/v0.5.1/v0.6.0 are reused when source footage, edit and AI settings match. Future cache identity uses model content instead of app version/helper timestamps, so text-only updates do not force another long AI pass. A failed cache save now shows a warning. New clips, changed cuts/layout/color/FPS/resolution/models or a removed/evicted cache still require AI processing again; runtime speed for new work is unchanged in this patch.

          Faster software preview: adaptive playing canvas, reduced frame transfers, reusable native buffers, cached blur/masks, lookup-table color correction, fewer React updates and source-timed frame polling. Linux automatically enables graphics compatibility when no readable GPU render node is present; force it with `RLCUT_SOFTWARE_RENDERING=1`. The preview now displays measured FPS and the sidebar shows the actual app version. Pausing restores a larger canvas. Preview optimizations do not change export settings. Actual FPS depends on the PC and scene.

          AI upscaling now automatically uses a hardware Vulkan GPU when its driver is working, with full-AI CPU fallback on failure. CPU inference processes tiles concurrently with shared model weights: up to 12 threads, leaving two threads available on larger machines, and one to three tile workers based on available RAM. Progress identifies the actual GPU or CPU backend. Software Vulkan devices are excluded; an unbound or missing GPU driver cannot provide acceleration. RIFE smoothing remains on CPU. Both Upscayl Lite and compact video models run offline in persistent workers. Keep selected size mode uses a 540 × 960 AI input for 1080 × 1920 output; ×2 enlargement remains available. AI processes the edited footage before crisp text and audio, then caches that video for later text/music edits. Exact duplicate frames reuse the previous enhanced result. Bounded concurrency, low priority and tiled inference reduce pressure. The final text/audio pass now estimates its own remaining time. Full AI processing has no timed quality downgrade or 45-minute cutoff; thirty minutes is a target, not a measured hardware guarantee.

          Docker playback forwards an available PulseAudio/PipeWire-Pulse socket or uses silent preview when none exists, preserving exported audio. Decoder timeouts now show a retry control. Choose 60 FPS for 30 FPS footage or 120 FPS for 60 FPS footage when smoothing. AI may introduce flicker, motion/texture errors or lose native detail; normal exports can look better for already sharp 4K recordings. No GPU, account, Python installation or model download is needed on your laptop.

          This release was built without running tests, as requested. Check SHA256SUMS after downloading.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/rlcut-Linux-x86_64.AppImage dist/rlcut-Linux-x86_64 dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/rlcut-Linux-x86_64.AppImage dist/rlcut-Linux-x86_64 dist/SHA256SUMS --verify-tag --title "rlcut $RELEASE_TAG · Linux AI export" --notes-file /tmp/release-notes.md
          fi
