name: Publish existing Linux build
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID containing the rlcut-Linux-x86_64 artifact'
        required: true
        type: string
      tag:
        description: 'Existing version tag matching the artifact commit'
        required: true
        type: string
  create:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release-publish-'))
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve requested build
        id: source
        env:
          INPUT_RUN: ${{ github.event.inputs.run_id }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          if [[ -n "$INPUT_RUN" ]]; then
            run_id="$INPUT_RUN"
            tag="$INPUT_TAG"
          else
            source="${SOURCE_REF#release-publish-}"
            run_id="${source##*-}"
            tag="${source%-*}"
          fi
          [[ "$run_id" =~ ^[0-9]+$ && "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'run_id=%s\ntag=%s\n' "$run_id" "$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.tag }}
      - name: Verify build belongs to the selected tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          source_commit="$(gh run view "$RUN_ID" --json headSha --jq .headSha)"
          test "$source_commit" = "$(git rev-parse HEAD)"
      - uses: actions/download-artifact@v4
        with:
          name: rlcut-Linux-x86_64
          path: dist
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify artifact integrity
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish existing AppImage and launcher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          Linux x86_64 AppImage with optional offline RIFE AI smoothing in Export.

          Download `rlcut-Linux-x86_64.AppImage`, make it executable, and run it. Without FUSE, use `--appimage-extract-and-run` or download the single-file `rlcut-Linux-x86_64` launcher.

          AI smoothing and 2× upscaling are optional, including 1080p. A persistent CPU worker keeps models loaded and caches the enhanced video without text or audio. Text/music/volume edits reuse that work. Half the available CPU threads (up to four), low priority and a 3 GiB inference address-space limit reduce pressure. After 40 minutes, remaining frames use blending/standard upscaling with a visible warning; unfinished enhanced exports stop at 45 minutes. Successful completion depends on hardware and output settings. Clear prepared videos in Settings → Clear AI cache.

          Choose 60 FPS for 30 FPS footage or 120 FPS for 60 FPS footage. Upscaling doubles output dimensions, up to 2160 × 3840. AI can introduce motion/texture artifacts; frame blending can cause ghosting. Preview is unchanged. No GPU, account, Python installation or model download is needed on your laptop.

          Built without running tests, as requested. Frontend/native builds passed locally. Verify downloads with SHA256SUMS.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/rlcut-Linux-x86_64.AppImage dist/rlcut-Linux-x86_64 dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/rlcut-Linux-x86_64.AppImage dist/rlcut-Linux-x86_64 dist/SHA256SUMS --verify-tag --title "rlcut $RELEASE_TAG · Linux AI export" --notes-file /tmp/release-notes.md
          fi
