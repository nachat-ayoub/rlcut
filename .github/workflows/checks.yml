name: checks
on: [push, pull_request, workflow_dispatch]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf ffmpeg
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml --features desktop
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --features desktop --all-targets -- -D warnings
      - name: Core process and geometry tests
        if: runner.os == 'Linux'
        run: npm run test:core
      - name: Environment launcher tests
        if: runner.os == 'Linux'
        run: npm run test:environment
      - name: Real FFmpeg pipeline tests
        if: runner.os == 'Linux'
        run: npm run test:integration
