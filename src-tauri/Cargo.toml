[package]
name = "rlcut"
version = "0.6.6"
edition = "2021"
rust-version = "1.85"

[lib]
name = "rlcut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rlcut"
path = "src/main.rs"
required-features = ["desktop"]

[[example]]
name = "player-fps"
path = "examples/player-fps.rs"
required-features = ["desktop"]

[features]
default = ["serialization"]
serialization = ["dep:serde", "dep:serde_json"]
desktop = ["serialization", "dep:tauri", "dep:tauri-build", "dep:rfd"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tauri = { version = "2", features = ["protocol-asset"], optional = true }
rfd = { version = "0.15", optional = true, default-features = false, features = ["gtk3"] }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
